[cursor.style]
blinking = "Off"
shape = "Block"

[font]
size = 10

[font.bold]
family = "MesloLGS Nerd Font"
style = "Bold"

[font.italic]
family = "MesloLGS Nerd Font"
style = "Italic"

[font.normal]
family = "MesloLGS Nerd Font"
style = "Regular"

[window]
dynamic_padding = true
opacity = 1.0

[window.padding]
x = 0
y = 0

[window.position]
x = 0
y = 0

[colors.primary]
background = "#181818"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\n"
